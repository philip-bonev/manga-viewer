<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPUB Comic Viewer</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id="toolbar">
      <button id="open-btn" class="toolbar-btn" title="Open EPUB file">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        Open
      </button>
      <span id="file-name">No file opened</span>
      <button id="close-btn" class="toolbar-btn" title="Close EPUB file" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        Close
      </button>
    </div>

    <div id="viewer-container">
      <div id="placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>Open an EPUB file to view comics</p>
      </div>
      <div id="images-container"></div>
      <div id="loading-indicator" class="hidden">
        <div class="spinner"></div>
        <p>Loading images...</p>
      </div>
    </div>

    <div id="image-counter" class="hidden">
      <span id="current-image">0</span> / <span id="total-images">0</span>
    </div>
  </body>
</html>
