[package]
name = "manga-viewer"
version = "0.9.0"
description = "Manga and Comic viewer."
authors = ["Philip Bonev"]
edition = "2024"

[lib]
name = "manga_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
base64 = "0.22"
regex = "1"
percent-encoding = "2"
tar = "0.4"
sevenz-rust = "0.6"
